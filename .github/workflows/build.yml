name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: 9d764a2d1be71c010cc4fc246de6b3b1d1787ef0

jobs:
  windows:
    name: Windows x64 (MSVC, Qt 6.8)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-pinned-win-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-pinned-win-static-md-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          # Pinned so that vcpkg's ABI hashes (and therefore the binary cache) stay stable.
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md > configure.log 2>&1
          $code = $LASTEXITCODE
          Get-Content configure.log
          exit $code

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build build > build.log 2>&1
          $code = $LASTEXITCODE
          Get-Content build.log
          exit $code

      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in 'configure.log', 'build.log') {
            if (Test-Path $log) {
              Select-String -Path $log -Pattern 'error C\d+|error LNK\d+|fatal error|CMake Error|error:|failed with|FAILED:' |
                Select-Object -First 40 |
                ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            }
          }
          Get-ChildItem "$env:RUNNER_TEMP\vcpkg\buildtrees" -Recurse -Filter '*-err.log' -ErrorAction SilentlyContinue |
            Select-Object -First 3 | ForEach-Object {
              Get-Content $_.FullName -Tail 15 | ForEach-Object { Write-Output ("::error::vcpkg: " + $_) }
            }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Lightcord.exe dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime dist/Lightcord.exe
          # Ship the three MSVC runtime DLLs instead of the 25 MB vc_redist installer.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) dist/
          }
          # Lightcord renders with the raster engine and uses the native Windows audio
          # backend: drop the DirectX shader compilers and the FFmpeg backend.
          Remove-Item -ErrorAction SilentlyContinue dist/dxcompiler.dll, dist/dxil.dll, dist/opengl32sw.dll
          Remove-Item -ErrorAction SilentlyContinue -Recurse dist/networkinformation, dist/generic
          if (Test-Path dist/multimedia/windowsmediaplugin.dll) {
            Remove-Item -ErrorAction SilentlyContinue dist/multimedia/ffmpegmediaplugin.dll
            Get-ChildItem dist -Filter 'av*.dll' | Remove-Item
            Get-ChildItem dist -Filter 'sw*.dll' | Remove-Item
          }
          Copy-Item LICENSE, README.md dist/
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item third_party/rnnoise/COPYING dist/licenses/RNNoise.txt
          Copy-Item third_party/libdave/LICENSE dist/licenses/libdave.txt
          foreach ($dep in 'opus', 'libsodium', 'openssl', 'mlspp', 'nlohmann-json') {
            $c = "build/vcpkg_installed/x64-windows-static-md/share/$dep/copyright"
            if (Test-Path $c) { Copy-Item $c "dist/licenses/$dep.txt" }
          }
          $size = (Get-ChildItem dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          $top = (Get-ChildItem dist -Recurse -File | Sort-Object Length -Descending | Select-Object -First 6 |
            ForEach-Object { "{0} {1:N1}MB" -f $_.Name, ($_.Length / 1MB) }) -join ', '
          Write-Output ("::notice::Windows package size: {0:N1} MB. Largest: {1}" -f $size, $top)

      - uses: actions/upload-artifact@v4
        with:
          name: Lightcord-windows-x64
          path: dist

  linux:
    name: Linux (GCC, Qt 6 from Ubuntu)
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev pkg-config \
            qt6-base-dev qt6-websockets-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-pinned-linux-${{ hashFiles('vcpkg.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-pinned-linux-

      - name: Set up vcpkg
        run: |
          mkdir -p .vcpkg-cache
          # Pinned so that vcpkg's ABI hashes (and therefore the binary cache) stay stable.
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" 2>&1 | tee configure.log

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          for log in configure.log build.log; do
            [ -f "$log" ] && grep -E "error:|undefined reference|multiple definition|relocation|cannot find|ld:|CMake Error|failed with|FAILED:" "$log" | cut -c1-400 | head -40 | sed 's/^/::error::/' || true
          done
          find "$RUNNER_TEMP/vcpkg/buildtrees" -name '*-err.log' 2>/dev/null | head -3 | while read f; do
            tail -15 "$f" | sed 's/^/::error::vcpkg: /'
          done

      - name: Test
        run: ctest --test-dir build --output-on-failure
