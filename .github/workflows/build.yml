name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: 9d764a2d1be71c010cc4fc246de6b3b1d1787ef0

jobs:
  windows:
    name: Windows x64 (MSVC, Qt 6.8)
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-pinned-win-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-pinned-win-static-md-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          # Pinned so that vcpkg's ABI hashes (and therefore the binary cache) stay stable.
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md > configure.log 2>&1
          $code = $LASTEXITCODE
          Get-Content configure.log
          exit $code

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build build > build.log 2>&1
          $code = $LASTEXITCODE
          Get-Content build.log
          exit $code

      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in 'configure.log', 'build.log') {
            if (Test-Path $log) {
              Select-String -Path $log -Pattern 'error C\d+|error LNK\d+|fatal error|CMake Error|error:|failed with|FAILED:' |
                Select-Object -First 40 |
                ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            }
          }
          Get-ChildItem "$env:RUNNER_TEMP\vcpkg\buildtrees" -Recurse -Filter '*-err.log' -ErrorAction SilentlyContinue |
            Select-Object -First 3 | ForEach-Object {
              Get-Content $_.FullName -Tail 15 | ForEach-Object { Write-Output ("::error::vcpkg: " + $_) }
            }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Lightcord.exe dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime dist/Lightcord.exe
          # Ship the three MSVC runtime DLLs instead of the 25 MB vc_redist installer.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) dist/
          }
          # Lightcord renders with the raster engine and uses the native Windows audio
          # backend: drop the DirectX shader compilers and the FFmpeg backend.
          Remove-Item -ErrorAction SilentlyContinue dist/dxcompiler.dll, dist/dxil.dll, dist/opengl32sw.dll
          Remove-Item -ErrorAction SilentlyContinue -Recurse dist/networkinformation, dist/generic
          if (Test-Path dist/multimedia/windowsmediaplugin.dll) {
            Remove-Item -ErrorAction SilentlyContinue dist/multimedia/ffmpegmediaplugin.dll
            Get-ChildItem dist -Filter 'av*.dll' | Remove-Item
            Get-ChildItem dist -Filter 'sw*.dll' | Remove-Item
          }
          Copy-Item LICENSE, README.md dist/
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item third_party/rnnoise/COPYING dist/licenses/RNNoise.txt
          Copy-Item third_party/libdave/LICENSE dist/licenses/libdave.txt
          foreach ($dep in 'opus', 'libsodium', 'openssl', 'mlspp', 'nlohmann-json') {
            $c = "build/vcpkg_installed/x64-windows-static-md/share/$dep/copyright"
            if (Test-Path $c) { Copy-Item $c "dist/licenses/$dep.txt" }
          }
          $size = (Get-ChildItem dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          $top = (Get-ChildItem dist -Recurse -File | Sort-Object Length -Descending | Select-Object -First 6 |
            ForEach-Object { "{0} {1:N1}MB" -f $_.Name, ($_.Length / 1MB) }) -join ', '
          Write-Output ("::notice::Windows package size: {0:N1} MB. Largest: {1}" -f $size, $top)

      - name: Upload unsigned package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Lightcord-windows-x64
          path: dist

  linux:
    name: Linux (GCC, Qt 6 from Ubuntu)
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # autoconf/automake/libtool: vcpkg builds libsodium with autotools on Linux
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev pkg-config \
            autoconf autoconf-archive automake libtool \
            qt6-base-dev qt6-websockets-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-pinned-linux-${{ hashFiles('vcpkg.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-pinned-linux-

      - name: Set up vcpkg
        run: |
          mkdir -p .vcpkg-cache
          # Pinned so that vcpkg's ABI hashes (and therefore the binary cache) stay stable.
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" 2>&1 | tee configure.log

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          for log in configure.log build.log; do
            [ -f "$log" ] && grep -E "error:|undefined reference|multiple definition|relocation|cannot find|ld:|CMake Error|failed with|FAILED:" "$log" | cut -c1-400 | head -40 | sed 's/^/::error::/' || true
          done
          find "$RUNNER_TEMP/vcpkg/buildtrees" -name '*-err.log' 2>/dev/null | head -3 | while read f; do
            tail -15 "$f" | sed 's/^/::error::vcpkg: /'
          done

      - name: Test
        run: ctest --test-dir build --output-on-failure

  plan:
    # Decides whether this push publishes a release: main reaches a version
    # (project(VERSION) in CMakeLists.txt) that has notes in docs/release-notes/v<version>.md
    # and no GitHub release yet.
    name: Plan release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to release
        id: plan
        run: |
          VERSION=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -1)
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ ! -f "docs/release-notes/${TAG}.md" ]; then
            echo "No release notes for ${TAG}; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  sign:
    # Signs Lightcord.exe through SignPath (free code signing for open source, certificate by
    # SignPath Foundation). Runs only for releases, and only once the repository variable
    # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist (see docs/CODE_SIGNING.md).
    # Every request waits for manual approval in SignPath.
    name: Sign Windows package (SignPath)
    needs: [plan, windows, linux]
    if: needs.plan.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # lets SignPath download the unsigned artifact of this run
    steps:
      - name: Submit signing request and wait for approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Lightcord' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }} # empty: the project's default
          github-artifact-id: ${{ needs.windows.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.plan.outputs.version }}"
          wait-for-completion: true
          # Time for an approver to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/Lightcord.exe
          Write-Output ("Status: {0}; signer: {1}" -f $sig.Status, $sig.SignerCertificate.Subject)
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::Lightcord.exe is not validly signed ($($sig.Status))"
            exit 1
          }
          $info = (Get-Item signed/Lightcord.exe).VersionInfo
          if ($info.ProductName -ne 'Lightcord' -or $info.ProductVersion -ne '${{ needs.plan.outputs.version }}') {
            Write-Output "::error::Unexpected metadata: $($info.ProductName) $($info.ProductVersion)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Lightcord-windows-x64-signed
          path: signed

  release:
    name: Publish GitHub release
    needs: [plan, windows, linux, sign]
    # Publishes a signed package when SignPath is configured, and the unsigned one otherwise.
    # A failed or rejected signing request stops the release instead of falling back.
    if: >-
      always() && needs.plan.outputs.publish == 'true' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'Lightcord-windows-x64-signed' || 'Lightcord-windows-x64' }}
          path: package

      - name: Create ZIP and checksum
        run: |
          DIR="Lightcord-${{ needs.plan.outputs.version }}"
          ZIP="${DIR}-windows-x64.zip"
          mv package "$DIR"
          zip -qr9 "$ZIP" "$DIR"
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          if [ "${{ needs.sign.result }}" = "success" ]; then
            echo "::notice::Publishing the SignPath-signed package."
          else
            echo "::warning::SignPath is not configured: publishing an unsigned package."
          fi

      - name: Publish release
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          PRERELEASE=""
          case "$TAG" in v0.*|*-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "Lightcord ${{ needs.plan.outputs.version }}" \
            --notes-file "docs/release-notes/${TAG}.md" \
            $PRERELEASE
          echo "::notice::Published $(gh release view "$TAG" --json url --jq .url)"
